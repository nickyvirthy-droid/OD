# =============================================================================
# OmegaDrakon — Ferramentas de Terceiro (absorvidas do Project NOMAD)
# =============================================================================
# NÃO sobe automaticamente. Para subir:
#   docker compose -f docker/tools-compose.yaml up -d
# Para derrubar:
#   docker compose -f docker/tools-compose.yaml down
#
# Segredos (regra do dono, 2026-10-15): NADA de senha literal neste arquivo.
#   ADMIN_TOKEN e HBOX_AUTH_API_KEY_PEPPER vivem no .env da raiz (600,
#   gitignored) e chegam aqui por interpolação — docker/.env é symlink
#   para ../.env, então funciona de qualquer cwd. Se faltar, o compose
#   FALHA ALTO (:) em vez de subir container sem token.
#
# Segurança por design:
#   * Todos os serviços bindados em 127.0.0.1 — NÃO ficam expostos à internet.
#   * Acesso de fora: via Tailscale (já ativo no servidor).
#       tailscale serve --bg http://127.0.0.1:<porta>
#     Depois abre https://nicky-server.<tailnet>.ts.net:<porta> do seu device.
#   * Vaultwarden: roda HTTP interno; o HTTPS (obrigatório para cofre) vem do
#     Tailscale Serve. Sem cert auto-assinado.
#
# Receitas (imagem/porta/bind/env) reaproveitadas do Project NOMAD
# (Apache-2.0, github.com/.../project-nomad — service_seeder.ts), com atribuição.
#
# Armazenamento fora do repo: /home/alex/omegadrakon-tools/
# =============================================================================

name: omegadrakon-tools

services:
  # ---------------------------------------------------------------------------
  # 1. Kiwix — Wikipédia offline (ação kiwix_* + etapa 4.6 do chat)
  #    Baixar os ZIMs antes de subir (o bind /data precisa conter *.zim):
  #      wget -O /home/alex/omegadrakon-tools/zim/wikipedia_en_all_mini.zim \
  #        https://download.kiwix.org/zim/wikipedia/wikipedia_en_all_mini.zim
  #    (12,5 GB — owner escolheu "completa"; espelhos em download.kiwix.org)
  #    wikipedia_pt_all_mini_2026-05.zim (1,7 GB, 24/10 — ordem do dono:
  #    o chat fala pt-BR e termos em pt casavam 0 artigos no acervo só-EN;
  #    sha-256 conferido contra o .meta4 oficial de download.kiwix.org).
  #    A busca do kiwix-serve é GLOBAL nos dois ZIMs — por isso os dois
  #    caminhos posicionais no command.
  # ---------------------------------------------------------------------------
  kiwix:
    image: ghcr.io/kiwix/kiwix-serve:3.8.1
    container_name: od-kiwix
    restart: unless-stopped
    ports:
      - "127.0.0.1:8090:8080"
      # 192.168.0.205 = casa SEM Tailscale (ordem do dono 21/10: as 9
      # ferramentas abrem por porta direta na rede interna; IP do CABO,
      # trocado de .250 p/ .205 em 01/11 por ordem do dono — opção B,
      # com reserva DHCP fixando o .205 no roteador).
      - "192.168.0.205:8090:8080"
    volumes:
      - /home/alex/omegadrakon-tools/zim:/data:ro
    # O kiwix-serve precisa do arquivo ZIM como argumento posicional — sem
    # ele ele imprime o help e sai (crash loop). ZIM completo (14,4 GB)
    # renomeado pelo script de download em 13/10; PT somado em 24/10.
    command:
      - "--skipInvalid"
      - "/data/wikipedia_en_all_mini.zim"
      - "/data/wikipedia_pt_all_mini_2026-05.zim"
    mem_limit: 512m
    memswap_limit: 512m

  # ---------------------------------------------------------------------------
  # 2. CyberChef (Data Tools) — base64, hash, cifra, conversores (~300 op)
  # ---------------------------------------------------------------------------
  cyberchef:
    image: ghcr.io/gchq/cyberchef:10.24.0
    container_name: od-cyberchef
    restart: unless-stopped
    ports:
      - "127.0.0.1:8100:80"
      # LAN (ordem 21/10): casa sem Tailscale.
      - "192.168.0.205:8100:80"
    mem_limit: 256m
    memswap_limit: 256m

  # ---------------------------------------------------------------------------
  # 3. IT Tools — utilidades de dev (UUID, hash, formatadores)
  # ---------------------------------------------------------------------------
  it-tools:
    image: ghcr.io/corentinth/it-tools:2024.10.22-7ca5933
    container_name: od-it-tools
    restart: unless-stopped
    ports:
      - "127.0.0.1:8430:80"
      # LAN (ordem 21/10): casa sem Tailscale.
      - "192.168.0.205:8430:80"
    mem_limit: 128m
    memswap_limit: 128m

  # ---------------------------------------------------------------------------
  # 4. FlatNotes (Notes) — caderno markdown canônico do assistente
  #    auth=password desde 21/10 (aberto na LAN; notas/TODO não ficam
  #    sem porta). API REST que as actions flatnotes_status/anota/busca
  #    operam (v1.40.0) — o cliente faz login e carrega a sessão.
  # ---------------------------------------------------------------------------
  flatnotes:
    image: dullage/flatnotes:v5.5.5
    container_name: od-flatnotes
    restart: unless-stopped
    ports:
      - "127.0.0.1:8200:8080"
      # Bind triplo (21/10): 127.0.0.1 = ações do sistema; LAN =
      # casa sem Tailscale; tailnet via `tailscale serve --bg
      # --tcp=8200 tcp://127.0.0.1:8200` (01/11, ordem do dono
      # "corrija" — ver serviço 7: bind no IP da tailnet derrubava o
      # container no boot por corrida docker x tailscaled). Funnel: não.
      - "192.168.0.205:8200:8080"
    volumes:
      - /home/alex/omegadrakon-tools/flatnotes:/data
    environment:
      # 22/10 (dono, ordem de praticidade: "se for ter que digitar senha
      # não vou querer"): SENHA DESLIGADA (FLATNOTES_AUTH_TYPE=none no
      # .env) — o portário do Site é o portão (só a conta do dono passa)
      # e o cliente do sistema opera no caminho anônimo (flatnotes_anota/
      # busca provados). Antes (21/10) era password; a rede interna
      # aberta era o motivo — com o portário, o motivo caiu.
      - FLATNOTES_AUTH_TYPE=${FLATNOTES_AUTH_TYPE:-none}
      - FLATNOTES_USERNAME=${FLATNOTES_USERNAME:-dono}
      - FLATNOTES_PASSWORD=${FLATNOTES_PASSWORD:?defina FLATNOTES_PASSWORD no .env (21/10)}
      - FLATNOTES_SECRET_KEY=${FLATNOTES_SECRET_KEY:?defina FLATNOTES_SECRET_KEY no .env (21/10 — assina a sessão)}
    mem_limit: 256m
    memswap_limit: 256m

  # ---------------------------------------------------------------------------
  # 5. Stirling PDF — 50+ ferramentas de PDF (merge, split, OCR, assinar, cifrar)
  #    SECURITY_ENABLELOGIN=false = sem login (LAN + tailnet desde 21/10;
  #    nunca no Funnel — o gate público é o Site).
  # ---------------------------------------------------------------------------
  stirling-pdf:
    image: ghcr.io/stirling-tools/s-pdf:2.13.1
    container_name: od-stirling-pdf
    restart: unless-stopped
    ports:
      - "127.0.0.1:8400:8080"
      # LAN (ordem 21/10): casa sem Tailscale.
      - "192.168.0.205:8400:8080"
    volumes:
      - /home/alex/omegadrakon-tools/stirling-pdf/configs:/configs
      - /home/alex/omegadrakon-tools/stirling-pdf/logs:/logs
    environment:
      - SECURITY_ENABLELOGIN=false
      - LANGS=pt_BR,en_GB
      # 2026-10-12: crash loop (1917 restarts) por java.lang.OutOfMemoryError:
      # Metaspace — o MaxMetaspaceSize=128m do entrypoint não segura a 2.13.1.
      # Lista igual à do entrypoint com MaxMetaspaceSize=256m; mem cgroup
      # sobe para 1500m (heap 60% + metaspace + off-heap precisam de folga).
      - JAVA_TOOL_OPTIONS=-XX:+ExitOnOutOfMemoryError -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/configs/heap_dumps -XX:+UseG1GC -XX:MaxGCPauseMillis=200 -XX:G1HeapRegionSize=4m -XX:G1PeriodicGCInterval=60000 -XX:+UseStringDeduplication -XX:+UseCompactObjectHeaders -XX:+ExplicitGCInvokesConcurrent -Dspring.threads.virtual.enabled=true -Djava.awt.headless=true -XX:InitialRAMPercentage=25 -XX:MaxRAMPercentage=60 -XX:MaxMetaspaceSize=256m
    mem_limit: 1500m
    memswap_limit: 1500m

  # ---------------------------------------------------------------------------
  # 6. File Browser — gerenciar arquivos pela web (UI para o owner)
  #    /srv = pasta de arquivos; /db = banco do filebrowser.
  #    Login: admin + senha forte gerada pelo sistema em 18/10 (o admin/admin
  #    nunca chegou a funcionar). Valor: OD_FILEBROWSER_PASSWORD no .env + cofre.
  # ---------------------------------------------------------------------------
  filebrowser:
    image: filebrowser/filebrowser:v2.63.23
    container_name: od-filebrowser
    restart: unless-stopped
    ports:
      # Bind duplo (01/11, ordem do dono "corrija" — mesma causa raiz
      # do calibre, serviço 7): IP da tailnet fora do compose; tailnet
      # via `tailscale serve --bg --tcp=8410 tcp://127.0.0.1:8410`.
      # Gate público segue o Site; login próprio é defesa em profundidade.
      - "127.0.0.1:8410:80"
      - "192.168.0.205:8410:80"
    volumes:
      - /home/alex/omegadrakon-tools/filebrowser/files:/srv
      - /home/alex/omegadrakon-tools/filebrowser/db:/database
      # Fonte do baseURL (e port/root/log): montado para sobreviver a
      # recriação do container — sem ele o app volta para a raiz e quebra
      # sob subcaminho (provado no portal legado: JS dava 404).
      - ./filebrowser-settings.json:/config/settings.json:ro
    environment:
      # Fase 1 (21/10): UI e API sob /f/caixa no portário do Site.
      # ATENÇÃO à precedência (apurada ao vivo): settings.json > db > env —
      # o env sozinho NÃO basta (settings.json com baseURL "" explícito
      # vence); por isso o settings versionado acima é a fonte única.
      - FILEBROWSER_BASEURL=/f/caixa
    mem_limit: 128m
    memswap_limit: 128m

  # ---------------------------------------------------------------------------
  # 7. Calibre Web — biblioteca de e-books do dono, leitura no navegador
  #    PUID/PGID 1000 = usuário alex (confere no servidor).
  #    Login: admin + senha NO .env (OD_CALIBRE_PASSWORD — trocada 19/10,
  #    a admin/admin123 documentada aqui estava viva; espelhada no cofre).
  #    Biblioteca = espelho do Google Drive "Biblioteca" do dono (22 pastas
  #    temáticas) montado com calibredb; dbconfig aponta /books.
  # ---------------------------------------------------------------------------
  calibre-web:
    image: linuxserver/calibre-web:0.6.26-ls386
    container_name: od-calibre-web
    restart: unless-stopped
    ports:
      # Bind duplo (01/11, ordem do dono "corrija"): Causa raiz do
      # exit 128 no reboot de 31/10 — o dockerd programava o bind em
      # 100.77.67.53:8420 ANTES do tailscaled atribuir o IP ao
      # tailscale0 ("cannot assign requested address"; o docker só
      # programa a rede na CRIAÇÃO, então start/restart depois não
      # consertavam). Tailnet agora via `tailscale serve --bg
      # --tcp=8420 tcp://127.0.0.1:8420` — mesma URL (IP e hostname),
      # tailnet only, e127.0.0.1 nunca falha no boot.
      - "127.0.0.1:8420:8083"
      - "192.168.0.205:8420:8083"
    volumes:
      - /home/alex/omegadrakon-tools/calibreweb/config:/config
      - /home/alex/omegadrakon-tools/books:/books
    environment:
      - PUID=1000
      - PGID=1000
    mem_limit: 256m
    memswap_limit: 256m

  # ---------------------------------------------------------------------------
  # 8. Homebox — REATIVADO em 2026-10-17 (ordem do dono: uso definido =
  #    inventário de ferramentas e peças — o sistema consulta e cadastra).
  #    Dados preservados em /home/alex/omegadrakon-tools/homebox (nada apagado
  #    no desligamento de 17/10; conta de API criada na reativação).
  #    QR + API REST em 127.0.0.1:8470.
  # ---------------------------------------------------------------------------
  homebox:
    image: ghcr.io/sysadminsmedia/homebox:0.26.2
    container_name: od-homebox
    restart: unless-stopped
    ports:
      - "127.0.0.1:8470:7745"
      # LAN (ordem 21/10): casa sem Tailscale.
      - "192.168.0.205:8470:7745"
    volumes:
      - /home/alex/omegadrakon-tools/homebox:/data
    environment:
      - HBOX_TELEMETRY_ENABLED=false
      - HBOX_AUTH_API_KEY_PEPPER=${HBOX_AUTH_API_KEY_PEPPER:?defina HBOX_AUTH_API_KEY_PEPPER no .env (movido do compose em 2026-10-15)}
    mem_limit: 256m
    memswap_limit: 256m

  # ---------------------------------------------------------------------------
  # 9. Vaultwarden — cofre de senhas compatível Bitwarden (resolve higiene de
  #    segredos). HTTP interno; HTTPS via Tailscale Serve (obrigatório para o
  #    web vault registrar/unlock). Signups abertos até criar conta → depois
  #    fechar (SIGNUPS_ALLOWED=false).
  # ---------------------------------------------------------------------------
  vaultwarden:
    # 22/10: 1.36.0 -> 1.37.4 — clientes Bitwarden 2026.7+ mostram cofre
    # VAZIO contra servidores < 1.37 (issue upstream #7485; sintoma do
    # dono: "no app Bitwarden nada"). Banco com backup prévio.
    image: vaultwarden/server:1.37.4
    container_name: od-vaultwarden
    restart: unless-stopped
    ports:
      - "127.0.0.1:8480:80"
      # LAN (ordem 21/10): casa sem Tailscale — cofre com login próprio.
      - "192.168.0.205:8480:80"
    volumes:
      - /home/alex/omegadrakon-tools/vaultwarden:/data
    environment:
      - WEBSOCKET_ENABLED=true
      - SIGNUPS_ALLOWED=false
      # Fase 1 (21/10): domínio com PATH — web vault sob /f/cofre no
      # portário do Site (funnel público + LAN; opção nativa do Vault).
      # O acesso direto :8443 segue no tailscale serve (legado, tailnet).
      - DOMAIN=https://nicky-server.tail1b1f51.ts.net/f/cofre
      - ADMIN_TOKEN=${ADMIN_TOKEN:?defina ADMIN_TOKEN no .env (movido do compose em 2026-10-15)}
    mem_limit: 256m
    memswap_limit: 256m

# =============================================================================
# 10. OpenTelemetry Collector — recebe OTLP/HTTP (4318) e exporta para
#     Tempo (traces), Loki (logs), Prometheus (metrics).
#     OD_OTEL_ENDPOINT=http://127.0.0.1:4318 no .env do od-core.
# ---------------------------------------------------------------------------
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.115.0
    container_name: od-otel-collector
    restart: unless-stopped
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "192.168.0.205:4317:4317"
      - "192.168.0.205:4318:4318"
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    depends_on:
      - tempo
      - loki
      - prometheus
    mem_limit: 512m
    memswap_limit: 512m

# =============================================================================
# 11. Tempo — armazenamento de traces (Grafana Tempo)
# ---------------------------------------------------------------------------
  tempo:
    image: grafana/tempo:2.5.0
    container_name: od-tempo
    restart: unless-stopped
    ports:
      - "127.0.0.1:3200:3200"
      - "192.168.0.205:3200:3200"
    volumes:
      - ./tempo.yaml:/etc/tempo.yaml:ro
      - /home/alex/omegadrakon-tools/tempo:/var/tempo
    command:
      - "-config.file=/etc/tempo.yaml"
    mem_limit: 512m
    memswap_limit: 512m

# =============================================================================
# 12. Loki — armazenamento de logs (Grafana Loki)
# ---------------------------------------------------------------------------
  loki:
    image: grafana/loki:3.0.0
    container_name: od-loki
    restart: unless-stopped
    ports:
      - "127.0.0.1:3100:3100"
      - "192.168.0.205:3100:3100"
    volumes:
      - ./loki.yaml:/etc/loki.yaml:ro
      - /home/alex/omegadrakon-tools/loki:/loki
    command:
      - "-config.file=/etc/loki.yaml"
    mem_limit: 512m
    memswap_limit: 512m

# =============================================================================
# 13. Prometheus — armazenamento de métricas
# ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.54.0
    container_name: od-prometheus
    restart: unless-stopped
    ports:
      - "127.0.0.1:9090:9090"
      - "192.168.0.205:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - /home/alex/omegadrakon-tools/prometheus:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.enable-lifecycle"
      - "--web.enable-remote-write-receiver"
    mem_limit: 512m
    memswap_limit: 512m

# =============================================================================
# 14. Grafana — visualização unificada (Tempo + Loki + Prometheus)
# ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:11.1.0
    container_name: od-grafana
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
      - "192.168.0.205:3000:3000"
    volumes:
      - /home/alex/omegadrakon-tools/grafana:/var/lib/grafana
      - ./grafana-datasources.yaml:/etc/grafana/provisioning/datasources/datasources.yaml:ro
    environment:
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?defina GRAFANA_ADMIN_PASSWORD no .env}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-piechart-panel
    depends_on:
      - tempo
      - loki
      - prometheus
    mem_limit: 256m
    memswap_limit: 256m
