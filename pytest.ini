# OMEGA DRAKON • PYTEST
#
# analise/ é a CAIXA DE ENTRADA do dono (regra 17 do iniciar/RULES.md):
# ele deposita lá arquivos/pastas arbitrários antes de mandar analisar.
# Sem esta trava, um `test_*.py` depositado (ex.: analise/Nicky Locutor,
# 23/10) quebra a COLEÇÃO do gate com ModuleNotFoundError de dependência
# que nem é nossa — a suíte inteira para antes de rodar.
# Os defaults do pytest são mantidos explicitamente abaixo.
[pytest]
norecursedirs =
    .*
    *.egg
    build
    CVS
    dist
    node_modules
    venv
    analise
    backups
    data
    logs
