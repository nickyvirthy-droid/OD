[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "omega-drakon"
version = "1.44.0"
description = "Omega Drakon — Assistente inteligente com soberania local"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "Alex Projeti", email = "alex@omegadrakon.local"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Operating System :: POSIX :: Linux",
]
requires-python = ">=3.12"
dependencies = [
    "pg8000>=1.31",
    "google-auth>=2.0",
    "websockets>=14.0",
    "python-dotenv>=1.0",
    "requests>=2.31",
    "qrcode>=8.0",
    "edge-tts>=7.0",
    "opentelemetry-sdk>=1.27",
    "opentelemetry-exporter-otlp-proto-http>=1.27",
    "scikit-learn>=1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=9.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
]
audio = [
    "piper-tts>=1.2",
]
observability = [
    "prometheus-client>=0.19",
    "grafana-api>=1.0",
]
full = [
    "piper-tts>=1.2",
    "prometheus-client>=0.19",
    "grafana-api>=1.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["core*", "tools*", "memory*", "runtime*", "integrations*", "agents*", "observability*"]

[tool.setuptools.package-data]
"*" = ["*.py", "*.json", "*.yaml", "*.yml", "*.toml", "*.md", "*.txt", "*.sql"]

[tool.pytest.ini_options]
asyncio_mode = "strict"
testpaths = ["tests"]
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"
addopts = "-q --tb=short"
filterwarnings = [
    "ignore::DeprecationWarning",
]

[tool.ruff]
target-version = "py312"
line-length = 120
select = ["E", "F", "I", "UP", "B", "C4", "W", "N", "D", "T20", "SIM", "PTH", "ERA", "RSE", "RET", "PIE", "LOG", "ARG", "PL", "TRY", "NPY", "TID", "G", "INP", "EXE", "ISC", "ICN", "PD", "PGH", "PT", "Q", "RUF", "SLF", "SLOT", "TRY", "TCH", "ASYNC"]
ignore = ["E501", "D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107"]
per-file-ignores = { "tests/*" = ["D100", "D101", "D102", "D103", "D104", "D105", "D106", "D107", "S101"], "tools/audio/*" = ["S101"] }

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = true
disallow_untyped_decorators = false
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_no_return = true
strict_optional = true
show_error_codes = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "."
files = ["core", "tools", "memory", "runtime", "integrations", "agents", "observability"]
exclude = ["tests", ".venv", "build", "dist", "__pycache__", ".pytest_cache", ".mypy_cache"]

[tool.coverage.run]
source = ["core", "tools", "memory", "runtime", "integrations", "agents", "observability"]
omit = ["tests/*", "*/__pycache__/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]